plugins {
    id 'com.android.application'
}

android {
    namespace 'com.artplaygames.sampclient'
    compileSdk 34

    defaultConfig {
        applicationId "com.viceside.mobile"
        minSdk 22
        targetSdk 34
        versionCode 2
        versionName "1.1"

        vectorDrawables.useSupportLibrary true
    }

    signingConfigs {
        debugFixed {
            storeFile file('keystore/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            signingConfig signingConfigs.debugFixed
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debugFixed
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
    }
}

configurations.all {
    // Some transitive dependencies still pull kotlin-stdlib-jdk7/jdk8 1.6.x,
    // which duplicates classes already contained in kotlin-stdlib 1.8.x.
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.activity:activity:1.8.2'

    // Google Sign-In
    implementation 'com.google.android.gms:play-services-auth:20.7.0'
}
