name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Assemble Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android NDK & CMake
        uses: android-actions/setup-android@v3

      - name: Install Android NDK 28.0.13004108 & CMake
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "ndk;28.0.13004108" "cmake;3.22.1"

      - name: Set up Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify APK Architecture & Package
        run: |
          APK_FILE=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Error: Release APK not found!"
            exit 1
          fi
          echo "Found APK: $APK_FILE"
          
          # Check libraries inside APK
          unzip -l "$APK_FILE" | grep "lib/arm64-v8a/libGTASA.so" || { echo "Missing arm64 libGTASA.so"; exit 1; }
          unzip -l "$APK_FILE" | grep "lib/armeabi-v7a/libGTASA.so" || { echo "Missing armv7 libGTASA.so"; exit 1; }
          unzip -l "$APK_FILE" | grep "lib/arm64-v8a/libmultiplayer.so" || { echo "Missing arm64 libmultiplayer.so"; exit 1; }
          unzip -l "$APK_FILE" | grep "lib/armeabi-v7a/libmultiplayer.so" || { echo "Missing armv7 libmultiplayer.so"; exit 1; }
          echo "Verification passed: All required ABIs and native libraries are present!"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: samp-client-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "Vice Side Mobile All-in-One Client (${{ github.ref_name }})"
          body: |
            Official Release build for Vice Side Mobile Client (All-in-One).
            - Embedded SA-MP game client and Vice Side Launcher.
            - Package: com.viceside.mobile
            - Native arm64-v8a + armeabi-v7a support.
          files: app/build/outputs/apk/release/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
